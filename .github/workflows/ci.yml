# .github/workflows/ci.yml
#
# 质量门禁：lint、类型检查、用例文档一致性、单元测试。
#
# 为什么需要单独一个工作流：release.yml 只做打包发布，此前四个工作流里没有任何
# 一个跑 lint / typecheck / test——类型错误、lint 违规、单测失败都能直接进发布产物。
# 而且 tsconfig.json 没有被任何构建脚本引用（vite/esbuild 只转译、不做类型检查），
# 类型错误只有 IDE 和手工 tsc 能发现，所以这一步必须显式跑。
#
# E2E 分层：PR 运行 @smoke；main 推送、正式发布 tag（v*）或手动触发时运行全量质量门禁与全量 E2E；
# 真实打包产物冒烟见 e2e-nightly.yml（手动触发）。
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 同一分支 / PR / tag 的新提交取消旧的运行：门禁要的是最新一次的结果
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Github checkout
        uses: actions/checkout@v5
        # 补丁覆盖率门禁要对基线做 merge-base diff，需要完整历史；浅克隆下
        # origin/main...HEAD 可能解不出共同祖先。
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          # 读 .nvmrc 而不是写死 "22.x"：版本号只能有一个来源。
          # 之前 mise.toml 写 24、.nvmrc 写 22.23.4、这里写 22.x、engines 又同时允许
          # 22 与 24，四处各自表述，于是「本地过、CI 红」这类问题只能在推送后才发现。
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Install dependencies
        # CI 不需要装 git hook，跳过安装，避免在无 .git/hooks 写权限时产生噪音
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Unit tests
        # vitest 通过 ELECTRON_RUN_AS_NODE=1 以纯 Node 运行，不需要显示环境。
        # 带 --coverage 运行以执行 vitest.config 里的覆盖率阈值门禁（基线见该文件注释）。
        run: pnpm run test:coverage
      - name: Patch coverage
        # Patch 覆盖率检查：PR 取 base sha，push 取 github.event.before；
        # 首次推送/tag 推送无基线时脚本会自动跳过并放行。
        env:
          PATCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: pnpm run qa:patch-coverage --base "$PATCH_BASE"

  e2e-smoke:
    # PR 冒烟 E2E：快速验证核心启动、引导与设置链路
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Github checkout
        uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Install dependencies
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
        run: pnpm install --frozen-lockfile
      - name: Install display and media tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
          mkdir -p lib
          ln -sf "$(command -v ffmpeg)" lib/ffmpeg
          ln -sf "$(command -v ffprobe)" lib/ffprobe
      - name: E2E smoke
        env:
          QA_ELECTRON_NO_SANDBOX: '1'
        run: xvfb-run -a pnpm run test:e2e:smoke
      - name: Upload e2e smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-smoke-${{ github.run_id }}
          path: |
            qa/test-results/
            qa/playwright-report/
          if-no-files-found: ignore

  e2e-full:
    # 全量 E2E：main 推送、正式 tag 或手动触发时执行
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Github checkout
        uses: actions/checkout@v5
      - name: Enable Corepack
        run: corepack enable
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-electron-
      - name: Install dependencies
        env:
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: '1'
        run: pnpm install --frozen-lockfile
      - name: Install display and media tools
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
          mkdir -p lib
          ln -sf "$(command -v ffmpeg)" lib/ffmpeg
          ln -sf "$(command -v ffprobe)" lib/ffprobe
      - name: E2E full
        env:
          QA_ELECTRON_NO_SANDBOX: '1'
        run: xvfb-run -a pnpm run test:e2e
      - name: Upload e2e evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-full-${{ github.run_id }}
          path: |
            qa/test-results/
            qa/playwright-report/
          if-no-files-found: ignore
