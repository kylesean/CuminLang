name: Release Please

# 仅保留手动触发（workflow_dispatch）：日常推送 main 不自动创建发版 PR 或跑 Actions；
# 正式发布可直接推送 v* tag 触发 release.yml，或需要时在 Actions 页面手动触发本工作流。
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# 串行化：短时间内连续合并多个 PR 会触发多个 run 并行，各自基于旧快照计算版本，
# 曾产生重复的发版 PR 并导致发版状态错乱（v6.12.3 被跳过、manifest 与 tag 脱节）。
# 排队执行而不取消，保证每个 run 都基于前一个 run 的最新结果。
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # 发版 PR 合并（release_created 为 true）时，直接调用 release.yml 执行多平台构建；
  # 构建上下文即本次 push 的 main 提交（发版 PR 的合并结果，与 tag 内容一致）。
  # 安装包由 electron-forge publish 按 package.json 版本号自行挂到对应 Release，无需传 tag
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
